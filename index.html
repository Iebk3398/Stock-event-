/* Layout : app mobile d'une main — accueil = événements ; événement = barre du haut + 4 étapes, liste par onglet USNE, barre d'action fixe en bas. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --sunk: #f6f8fa;
  --ink: #18222e; --muted: #5b6878; --line: #d8dee6;
  --accent: #f2b705; --accent-ink: #2a2100;
  --good: #1d7a4a; --good-bg: #dff3e7;
  --warn: #8a5300; --warn-bg: #fdf0d2;
  --bad: #b3261e;  --bad-bg: #fbe2df;
  --info: #2a4f86; --info-bg: #e3ebf7;
  --shadow: 0 1px 2px rgba(24,34,46,.06), 0 4px 14px rgba(24,34,46,.06);
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151b; --surface: #1a212a; --sunk: #151b22; --ink: #e7ecf2; --muted: #9aa7b6; --line: #2c3641;
    --accent: #f5c431; --accent-ink: #231b00;
    --good: #6fd39c; --good-bg: #173527; --warn: #f0b85a; --warn-bg: #3a2c12;
    --bad: #ff8a80; --bad-bg: #3d1d1b; --info: #9ec0f0; --info-bg: #1c2b40;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151b; --surface: #1a212a; --sunk: #151b22; --ink: #e7ecf2; --muted: #9aa7b6; --line: #2c3641;
  --accent: #f5c431; --accent-ink: #231b00;
  --good: #6fd39c; --good-bg: #173527; --warn: #f0b85a; --warn-bg: #3a2c12;
  --bad: #ff8a80; --bad-bg: #3d1d1b; --info: #9ec0f0; --info-bg: #1c2b40;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 600; min-height: 46px; text-align: center; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.dark { background: var(--ink); color: var(--surface); border-color: transparent; }
.btn.ghost { background: none; border-color: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.link { border: 0; background: none; padding: 6px 4px; font-size: 13px; font-weight: 600; color: var(--info); }

.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar .wrap { padding-block: 8px 10px; display: grid; gap: 10px; }
.appbar-row { display: flex; align-items: center; gap: 6px; min-height: 44px; }
.back { border: 0; background: none; padding: 8px 8px 8px 0; display: flex; align-items: center; color: var(--muted); }
.back svg { width: 22px; height: 22px; }
.ev-title { flex: 1; min-width: 0; }
.ev-title h1 { margin: 0; font-family: var(--f-display); font-size: 21px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-title p { margin: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 22px; height: 22px; }

.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.step { border: 1px solid var(--line); background: var(--sunk); border-radius: 11px; padding: 7px 4px 8px; text-align: left; display: grid; gap: 3px; min-width: 0; }
.step .top { display: flex; align-items: center; gap: 3px; min-width: 0; }
.step .num { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-num); font-size: 10.5px; font-weight: 600; background: var(--line); color: var(--ink); flex: none; }
.step .lbl { font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.step .cnt { font-family: var(--f-num); font-size: 10.5px; letter-spacing: -.02em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .cnt .x { color: var(--bad); }
.step .bar { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.step .bar i { display: block; height: 100%; background: var(--good); }
.step[aria-current="step"] { background: var(--surface); border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.step .ok { color: var(--good); font-weight: 700; }
.step[aria-current="step"] .bar { background: color-mix(in srgb, var(--accent) 35%, var(--line)); }

main.wrap { padding-block: 14px calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.intro { margin: 0; color: var(--muted); font-size: 14px; }
.intro strong { color: var(--ink); }
.tools { display: grid; gap: 8px; }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; min-height: 46px; font-size: 16px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 13px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chips .n { font-family: var(--f-num); font-size: 11.5px; margin-left: 4px; opacity: .8; }

.group { display: grid; gap: 6px; }
.ghead { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
.ghead .code { font-family: var(--f-num); font-size: 11.5px; background: var(--ink); color: var(--surface); padding: 1px 6px; border-radius: 4px; }
.ghead h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; }
.ghead .cnt { font-family: var(--f-num); font-size: 12px; color: var(--muted); }
.ghead .link { margin-left: auto; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 10px 10px 8px; border-top: 1px solid var(--line); }
.item.nt { grid-template-columns: minmax(0, 1fr) auto; padding-left: 14px; }
.item:first-child { border-top: 0; }
.item.done { background: color-mix(in srgb, var(--good-bg) 50%, var(--surface)); }
.item.alert { background: color-mix(in srgb, var(--bad-bg) 55%, var(--surface)); }
.item.warnbg { background: color-mix(in srgb, var(--warn-bg) 55%, var(--surface)); }
.item.off { opacity: .55; }
.tick { width: 42px; height: 42px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.tick svg { width: 22px; height: 22px; opacity: 0; }
.tick svg path { stroke: var(--surface); }
.tick[aria-checked="true"] { background: var(--good); border-color: var(--good); }
.tick[aria-checked="true"] svg { opacity: 1; }
.name { font-weight: 600; overflow-wrap: anywhere; line-height: 1.25; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 10px; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.meta .q { font-family: var(--f-num); color: var(--ink); font-weight: 600; }
.chip { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 99px; letter-spacing: .01em; border: 0; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--info-bg); color: var(--info); }
.chip.neutral { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
button.chip { cursor: pointer; padding: 3px 9px; }
button.chip::after { content: " ⇄"; opacity: .6; font-weight: 600; }
.side { display: grid; gap: 4px; justify-items: end; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.stepper button { width: 36px; height: 42px; border: 0; background: none; font-size: 20px; font-weight: 600; color: var(--muted); padding: 0; }
.stepper input { width: 52px; height: 42px; border: 0; border-inline: 1px solid var(--line); text-align: center; font-family: var(--f-num); font-weight: 600; background: var(--surface); font-size: 16px; padding: 0; }
.stepper.sm input { width: 46px; }
.stepper input::placeholder { color: var(--muted); opacity: .75; font-weight: 500; }
.mini { border: 0; background: none; font-size: 12px; font-weight: 600; color: var(--muted); padding: 2px; text-decoration: underline; text-underline-offset: 2px; }
.empty { padding: 24px 18px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty strong { color: var(--ink); font-size: 16px; }
.box { border-radius: 12px; padding: 12px; font-size: 14px; display: grid; gap: 8px; }
.box.bad { background: var(--bad-bg); color: var(--bad); }
.box.info { background: var(--info-bg); color: var(--info); }
.box.warn { background: var(--warn-bg); color: var(--warn); }
.box .row { display: flex; gap: 8px; flex-wrap: wrap; }
.box b { font-weight: 700; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.summary div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: grid; gap: 1px; }
.summary b { font-family: var(--f-num); font-size: 18px; }
.summary span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.summary .g b { color: var(--good); } .summary .w b { color: var(--warn); } .summary .r b { color: var(--bad); }

.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
.actionbar .wrap { padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.actionbar .wrap.one { grid-template-columns: 1fr; }

.home-head { display: grid; gap: 4px; padding-top: 6px; }
.home-head .brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-num); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tape { display: inline-block; width: 16px; height: 16px; border-radius: 3px; background: repeating-linear-gradient(-45deg, var(--accent) 0 4px, var(--ink) 4px 8px); }
.home-head h1 { margin: 0; font-family: var(--f-display); font-size: 34px; font-weight: 700; text-transform: uppercase; line-height: 1; }
.flow { display: grid; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.flow div { padding: 10px 12px; display: grid; grid-template-columns: 22px auto 1fr; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
.flow div:first-child { border-top: 0; }
.flow b { font-family: var(--f-display); font-size: 14px; text-transform: uppercase; color: var(--ink); letter-spacing: .02em; }
.flow i { font-style: normal; font-family: var(--f-num); font-size: 11px; color: var(--accent-ink); background: var(--accent); width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; }
.evcard { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.evcard .t { display: flex; align-items: baseline; gap: 10px; }
.evcard h2 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.evcard .d { font-family: var(--f-num); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.evcard .f { font-size: 12.5px; color: var(--muted); margin-top: -6px; }
.evcard .next { font-size: 13px; font-weight: 600; color: var(--info); }
.evwrap { position: relative; }
.evwrap .evcard { padding-bottom: 14px; }
.evdel { position: absolute; right: 10px; bottom: 9px; border: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 6px 8px; border-radius: 9px; display: flex; align-items: center; gap: 4px; }
.evdel svg { width: 16px; height: 16px; }
.evdel.confirm { background: var(--bad); color: #fff; }
.eye { border: 1px solid var(--line); background: var(--sunk); color: var(--info); border-radius: 99px; padding: 1px 7px 1px 5px; margin-left: 6px; display: inline-flex; align-items: center; gap: 3px; vertical-align: 1px; font-size: 11.5px; font-weight: 700; font-family: var(--f-num); }
.eye svg { width: 15px; height: 15px; }
.photo { position: fixed; inset: 0; z-index: 60; background: #0d1117; color: #e7ecf2; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.ph-top { display: flex; align-items: center; gap: 8px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
.ph-top b { flex: 1; text-align: center; font-family: var(--f-display); font-size: 18px; text-transform: uppercase; letter-spacing: .03em; }
.ph-top button { border: 0; background: rgba(255,255,255,.1); color: #fff; border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
.ph-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 16px max(12px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; align-content: start; }
.ph-stage { position: relative; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 10px; overflow: hidden; background: #000; max-width: 100%; }
.ph-stage img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-touch-callout: none; }
.pf { position: absolute; border: 2.5px solid #f2b705; border-radius: 6px; background: rgba(242,183,5,.08); padding: 0; min-width: 18px; min-height: 18px; }
.pf.ok { border-color: #3ddc84; background: rgba(61,220,132,.10); }
.pf.sel { box-shadow: 0 0 0 3px #fff; }
.pf.draw { border-style: dashed; border-color: #fff; background: rgba(255,255,255,.12); pointer-events: none; }
.pf span { position: absolute; left: -2px; top: -2px; transform: translateY(-100%); max-width: 70vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #f2b705; color: #231b00; font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px 5px 5px 0; }
.pf.ok span { background: #3ddc84; color: #08210f; }
.pf.top span { transform: none; top: 0; border-radius: 0 0 5px 0; }
.ph-status { margin: 0; font-size: 14px; color: #c3ccd7; }
.ph-pick { background: #1a212a; border: 1px solid #2c3641; border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.ph-pick h3 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #9aa7b6; }
.ph-pick p { margin: 0; font-size: 14px; }
.ph-pick input { width: 100%; border: 1px solid #2c3641; background: #10151b; color: #e7ecf2; border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.ph-list { display: grid; gap: 6px; }
.ph-list button { text-align: left; border: 1px solid #2c3641; background: #10151b; color: #e7ecf2; border-radius: 10px; padding: 10px 12px; display: flex; gap: 8px; align-items: baseline; font-size: 15px; }
.ph-list button .s { font-family: var(--f-num); font-size: 11px; color: #9aa7b6; flex: none; }
.ph-list button[aria-pressed="true"] { border-color: #3ddc84; background: #173527; }
.ph-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ph-row button { border: 1px solid #2c3641; background: none; color: #e7ecf2; border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
.ph-row button.danger { color: #ff8a80; }
.ph-bar { padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); border-top: 1px solid #2c3641; }
.ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.ph-grid figure { margin: 0; display: grid; gap: 4px; justify-items: center; }
.ph-grid img { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--sunk); }
.mini-steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.mini-steps div { display: grid; gap: 4px; min-width: 0; }
.mini-steps span { font-size: 11px; letter-spacing: -.01em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-steps b { font-family: var(--f-num); color: var(--ink); font-weight: 600; }
.mini-steps .bar { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.mini-steps .bar i { display: block; height: 100%; background: var(--good); }
.evlist { display: grid; gap: 10px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.modes button { border: 0; background: none; border-radius: 9px; padding: 7px 8px; font-family: var(--f-display); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.modes button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.modes .n { font-family: var(--f-num); font-size: 11px; font-weight: 600; background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 0 6px; letter-spacing: 0; }
.steps.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.shopchip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.version { margin: 8px 0 0; text-align: center; font-family: var(--f-num); font-size: 11.5px; color: var(--muted); }
.section-lbl { margin: 6px 2px 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10,15,20,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.sheet .grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); justify-self: center; }
.sheet h2 { margin: 0; font-family: var(--f-display); font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
.sheet h3 { margin: 4px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label, .field .lab { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; min-height: 48px; width: 100%; font-size: 16px; }
.filepick { width: 100%; border: 2px dashed var(--line); border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px; background: var(--sunk); text-align: left; }
.filepick svg { width: 28px; height: 28px; color: var(--muted); flex: none; }
.filepick .fp-txt { flex: 1; min-width: 0; font-size: 14px; }
.filepick .fp-txt b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filepick.has { border-style: solid; border-color: var(--good); background: var(--good-bg); }
.sheet-actions { display: grid; gap: 8px; }
.menu { display: grid; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.menu button { border: 0; border-top: 1px solid var(--line); background: var(--surface); text-align: left; padding: 13px 14px; display: grid; gap: 1px; }
.menu button:first-child { border-top: 0; }
.menu button b { font-weight: 600; }
.menu button span { font-size: 12.5px; color: var(--muted); }
.menu button.danger b { color: var(--bad); }
.results { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.results button { border: 0; border-top: 1px solid var(--line); background: var(--surface); text-align: left; padding: 11px 12px; display: flex; gap: 8px; align-items: baseline; }
.results button:first-child { border-top: 0; }
.results .s { font-family: var(--f-num); font-size: 11px; color: var(--muted); flex: none; }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 50; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.sharebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sharebar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--muted); }
@media (max-width: 370px) { .fields { grid-template-columns: 1fr; } .step .lbl { font-size: 13.5px; } .step .cnt { font-size: 10px; } .summary b { font-size: 16px; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>
<div class="sharebar" id="sharebar" hidden><span></span><button class="btn primary" type="button" id="shareGo">Partager le fichier</button><button class="btn" type="button" id="shareX" aria-label="Fermer">✕</button></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="fileInput" accept=".xlsx,.pdf,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

<script src="lib/exceljs.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="lib/pdf.min.js"></script>
<script>
(function () {
  "use strict";
  /* ================= référentiel ================= */
  const APP_VERSION = "13";
  const EXTRA_TAG = "Ajout dernière minute";
  const SUIVI = "Suivi événement";
  const SHEET_LABEL = { UST: "Ustensiles", SPT: "Sport", EMB: "Emballage", NET: "Nettoyage", It: "IT / audio / vidéo", AUTRE: "Mobilier et courses" };
  const SHEET_ORDER = ["UST", "SPT", "EMB", "NET", "It", "AUTRE"];
  const COLS = { name: 1, voulu: 2, dispo: 3, prep: 4, out: 5, in: 6, rem: 7 };
  const col = (sheet, k) => COLS[k] + (String(sheet).trim() === "It" ? 1 : 0);
  // 3 types : à rendre (matériel), consommable (ne revient pas), hors stock (courses).
  const KIND = { durable: { label: "À rendre", cls: "neutral" }, conso: { label: "Consommable", cls: "info" }, hors: { label: "Hors stock", cls: "warn" } };
  const KIND_NEXT = { durable: "conso", conso: "hors", hors: "durable" };
  function classify(sheet, name) {
    const n = norm(name);
    if (sheet === "EMB") return "conso";
    if (sheet === "NET") return /balai|ramassette|seau|raclette|aspirateur|brosse|serpill|materiel general/.test(n) ? "durable" : "conso";
    if (sheet === "AUTRE") return /table|chaise|tapis|tente|banc|grille|panneau|pupitre|rideau|tonnelle/.test(n) ? "durable" : "hors";
    if (/combustible|allume.?feu|liquide allume|\bpiles?\b|baudruche|craie|gel de chafing/.test(n)) return "conso";
    return "durable";
  }
  const STEPS = [
    { k: "demande", n: 1, title: "Demande", help: "Ce que tu demandes au stock. Touche le type d'un article pour le changer : à rendre, consommable ou hors stock (courses)." },
    { k: "reponse", n: 2, title: "Réponse", help: "Importe la réponse du stock (PDF ou Excel). Tu vois tout de suite ce qui manque ou reste à confirmer." },
    { k: "retrait", n: 3, title: "Retrait", help: "Au stock : le compteur affiche ce que le stock a donné. Ajuste avec − / + si besoin, puis coche pour valider." },
    { k: "precheck", n: 4, title: "Pré-check", help: "Sur le lieu, avant de ranger, tout seul : ajuste le compteur à ce que tu as, puis coche. Un manque s'affiche en rouge. Pour les consommables, note seulement le reste à rendre." },
    { k: "retour", n: 5, title: "Retour", help: "Au stock, avec le responsable : le compteur reprend ton pré-check. Ajuste si besoin, puis coche ce qui est rendu." },
  ];
  /* ---------- Courses (alimentaire hors stock) ---------- */
  const COURSES = "Courses";
  const CSTEPS = [
    { k: "cstock", n: 1, title: "Au stock", help: "Au stock, regarde ce qui est déjà là : compte ce que tu mets de côté avec − / +, puis coche. 0 = rien trouvé. Le reste part dans la liste d'achats." },
    { k: "cachat", n: 2, title: "Achats", help: "En magasin : le compteur propose ce qui reste à acheter. Ajuste si besoin, puis coche. Touche le magasin pour le changer." },
    { k: "cbilan", n: 3, title: "Bilan", help: "Pour chaque article : ce qui vient du stock, ce qui a été acheté et ce qui manque encore. Exporte le compte rendu en PDF ou Excel." },
  ];
  const SHOPS = { COLRUYT: "Colruyt / Aldi", EPICERIE: "Épicerie", BOUCHERIE: "Boucherie", AH: "Albert Heijn", SOFABEL: "Sofabel", DESSERT: "Desserts" };
  const SHOP_ORDER = Object.keys(SHOPS);
  function guessShop(it) {
    const t = norm(it.name + " " + (it.rem || ""));
    if (/albert heijn|\bah\b/.test(t)) return "AH";
    if (/sofabel/.test(t)) return "SOFABEL";
    if (/tiramisu|dessert|gateau|baklava|patisserie orientale/.test(t)) return "DESSERT";
    if (/poulet|viande|boeuf|agneau|dinde|merguez|hache|veau|kefta|saucisse/.test(t)) return "BOUCHERIE";
    if (/oignon|menthe|persil|corr?iandre|\bail\b|filo|amande|fleur d.?oranger|sucre glace|sucre semoule|\bsel\b|poivre|curcuma|gingembre|cannelle|cumin|paprika|ras el hanout|epice|safran|citron|legume|fruit/.test(t)) return "EPICERIE";
    return "COLRUYT";
  }
  const shopOf = (it) => it.shop || guessShop(it);
  // Consommable pas (assez) présent au stock : il part tout seul dans les courses.
  // Couvert par le stock = max(dispo annoncé, quantité réellement sortie au retrait).
  const consoCovered = (it) => Math.max(isNum(it.dispo) ? toNum(it.dispo) : 0, it.outOk && isNum(it.out) ? toNum(it.out) : 0);
  const MISSING = ["zero", "part", "none", "tbc"];
  function consoMissing(ev, it) {
    if (it.kind !== "conso" || !it.inReq || it.noCourse || !isNum(it.voulu)) return false;
    if (it.course && !isNum(it.dispo) && !it.answered) return true;
    if (!MISSING.includes(repState(ev, it).k) && !(it.course)) return false;
    return toNum(it.voulu) - consoCovered(it) > 0;
  }
  const isFood = (i) => i.kind === "hors" && i.inReq;
  const courseItems = (ev) => ev.items.filter((i) => isFood(i) || consoMissing(ev, i));
  const cNeed = (it) => (it.kind !== "hors" ? (isNum(it.voulu) ? Math.max(0, toNum(it.voulu) - consoCovered(it)) : it.voulu) : it.voulu);
  const cUnit = (it) => (it.kind === "hors" ? (it.rem || "") : "");
  const withUnit = (v, it) => fmt(v) + (cUnit(it) && !blank(v) ? " " + cUnit(it) : "");
  function cRestWith(it, sv) { const n = cNeed(it); if (!isNum(n)) return isNum(sv) && toNum(sv) > 0 ? "à vérifier" : n; return Math.max(0, toNum(n) - (isNum(sv) ? toNum(sv) : 0)); }
  const cStk = (it) => (it.stkOk && isNum(it.stk) ? toNum(it.stk) : 0);
  const cRest = (it) => cRestWith(it, cStk(it));
  const needBuy = (it) => { const x = cRest(it); return isNum(x) ? x > 0 : !blank(x); };
  function cLeft(it) { const x = cRest(it); if (!it.buyOk) return x; if (!isNum(x)) return 0; return Math.max(0, x - (isNum(it.buy) ? toNum(it.buy) : 0)); }
  const leftNum = (it) => { const l = cLeft(it); return isNum(l) ? toNum(l) : blank(l) ? 0 : 1; };
  function cStatus(step, it) {
    if (step === "cstock") return it.stkOk ? "done" : "todo";
    if (step === "cachat") return !it.buyOk ? "todo" : leftNum(it) > 0 ? "diff" : "done";
    return leftNum(it) > 0 ? "diff" : "done";
  }
  const cItemsFor = (ev, step) => (step === "cachat" ? courseItems(ev).filter((i) => needBuy(i) || i.buyOk) : courseItems(ev));
  function cCount(ev, step) {
    const its = cItemsFor(ev, step); const st = its.map((i) => cStatus(step, i));
    return { total: its.length, done: st.filter((k) => (step === "cbilan" ? k === "done" : k !== "todo")).length, issues: step === "cachat" ? st.filter((k) => k === "diff").length : 0 };
  }
  function cCurrent(ev) {
    const its = courseItems(ev);
    if (its.some((i) => i.buyOk)) return cItemsFor(ev, "cachat").every((i) => i.buyOk) ? "cbilan" : "cachat";
    return its.length && its.every((i) => i.stkOk) ? "cachat" : "cstock";
  }
  function cEtat(it) {
    const l = leftNum(it);
    if (l > 0) return it.buyOk ? "Reste " + fmt(cLeft(it)) : "À acheter";
    if (!needBuy(it) && it.stkOk) return "Tout au stock";
    return "Complet";
  }
  const FIELD = { retrait: "out", precheck: "pre", retour: "in", cstock: "stk", cachat: "buy" };

  const ICON = {
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    files: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2"/></svg>',
    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    sheet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h8l5 5v15H6z"/><path d="M14 2v5h5M9 12h7M9 16h7"/></svg>',
  };

  /* ================= état ================= */
  let events = [];
  let view = { name: "home" };
  const ui = { filter: "", query: "", sheet: null, draftFile: null, confirmDelete: false, addQuery: "", addSel: null, keep: new Set() };
  let memoryOnly = false;
  let pendingImport = null;

  /* ================= utilitaires ================= */
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const isNum = (v) => typeof v === "number" || (typeof v === "string" && /^\s*-?\d+(?:[.,]\d+)?\s*$/.test(v));
  const toNum = (v) => (typeof v === "number" ? v : parseFloat(String(v).replace(",", ".")));
  const blank = (v) => v === null || v === undefined || String(v).trim() === "";
  const fmt = (v) => (blank(v) ? "–" : isNum(v) ? String(+toNum(v).toFixed(2)) : String(v).trim());
  function norm(s) { return String(s ?? "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[’']/g, " ").replace(/\s+/g, " ").trim(); }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  function fmtDate(iso, long) {
    if (!iso) return ""; const d = new Date(iso + "T12:00:00"); if (isNaN(d)) return iso;
    return d.toLocaleDateString("fr-BE", long ? { weekday: "long", day: "numeric", month: "long" } : { weekday: "short", day: "2-digit", month: "2-digit" });
  }
  function cellVal(c) {
    let v = c && c.value;
    if (v && typeof v === "object") {
      if (Array.isArray(v.richText)) v = v.richText.map((r) => r.text).join("");
      else if (v instanceof Date) v = v.toLocaleDateString("fr-BE");
      else if ("result" in v) v = v.result;
      else if ("text" in v) v = v.text;
      else v = "";
    }
    return v === undefined ? null : v;
  }
  const isTbc = (v) => /^\s*(tbc|à confirmer|a confirmer|\?)\s*$/i.test(String(v ?? ""));
  const requested = (v) => !blank(v) && !(isNum(v) && toNum(v) === 0);
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 3200); }
  const sortSheets = (a, b) => { const ia = SHEET_ORDER.indexOf(a), ib = SHEET_ORDER.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b); };
  // Le type choisi pour un article est retenu pour les prochains événements.
  let kindPrefs = {};
  try { kindPrefs = JSON.parse(localStorage.getItem("kind-prefs") || "{}") || {}; } catch (e) {}
  function setKindPref(it) { kindPrefs[it.sheet + "|" + norm(it.name)] = it.kind; try { localStorage.setItem("kind-prefs", JSON.stringify(kindPrefs)); } catch (e) {} }
  const kindFor = (sheet, name) => kindPrefs[sheet + "|" + norm(name)] || classify(sheet, name);

  /* ================= stockage (IndexedDB, sur le téléphone) ================= */
  let dbp = null;
  function idb() {
    if (!dbp) dbp = new Promise((res, rej) => { const r = indexedDB.open("stock-evenements", 1); r.onupgradeneeded = () => r.result.createObjectStore("events", { keyPath: "id" }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    return dbp;
  }
  async function dbAll() { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction("events").objectStore("events").getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); }); }
  async function dbPut(ev) { if (memoryOnly) return; try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction("events", "readwrite"); t.objectStore("events").put(ev); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { memoryOnly = true; toast("Le téléphone refuse l'enregistrement : exporte l'Excel pour ne rien perdre."); } }
  async function dbDel(id) { if (memoryOnly) return; try { const db = await idb(); await new Promise((res) => { const t = db.transaction("events", "readwrite"); t.objectStore("events").delete(id); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }
  let saveTimer = null;
  function persist(ev, now) { ev.updated = Date.now(); clearTimeout(saveTimer); if (now) dbPut(ev); else saveTimer = setTimeout(() => dbPut(ev), 250); }

  /* ================= modèle ================= */
  // item : { id, sheet, row, name, kind, voulu, dispo, answered, out, in, rem, extra, inReq }
  const isStock = (it) => it.kind !== "hors";
  const inReq = (it) => it.inReq;
  const onlyExtra = (it) => it.extra && !requested(it.voulu);
  const taken = (it) => isStock(it) && !!it.outOk && !blank(it.out);
  const cmp = (a, b) => (isNum(a) && isNum(b) ? toNum(a) - toNum(b) : String(a).trim() === String(b ?? "").trim() ? 0 : NaN);
  function repState(ev, it) {
    if (!isStock(it)) return { k: "hors", label: "Courses", cls: "warn" };
    if (onlyExtra(it)) return { k: "ok", label: "Ajout", cls: "info" };
    if (isTbc(it.dispo)) return { k: "tbc", label: "À confirmer", cls: "warn" };
    if (blank(it.dispo)) return it.answered ? { k: "none", label: "Pas de réponse", cls: "warn" } : (ev.replySheets || []).includes(it.sheet) ? { k: "none", label: "Absent de la réponse", cls: "warn" } : { k: "wait", label: "En attente", cls: "neutral" };
    if (!isNum(it.dispo)) return { k: "ok", label: fmt(it.dispo), cls: "good" };
    const d = toNum(it.dispo);
    if (d <= 0) return { k: "zero", label: "Indisponible", cls: "bad" };
    if (isNum(it.voulu) && d < toNum(it.voulu)) return { k: "part", label: "Manque " + fmt(toNum(it.voulu) - d), cls: "bad" };
    return { k: "ok", label: "Dispo", cls: "good" };
  }
  const expected = (it) => (isNum(it.dispo) && toNum(it.dispo) > 0 ? it.dispo : blank(it.voulu) ? 1 : it.voulu);
  function outState(it) {
    if (!taken(it)) return { k: "todo", label: "", cls: "" };
    if (onlyExtra(it)) return { k: "done", label: "Ajout", cls: "info" };
    const d = cmp(it.out, expected(it));
    if (d === 0) return { k: "done", label: "", cls: "" };
    if (isNaN(d)) return { k: "diff", label: "À vérifier", cls: "warn" };
    return { k: "diff", label: (d > 0 ? "+" : "−") + fmt(Math.abs(d)) + (isNum(it.dispo) && toNum(it.dispo) > 0 ? " vs donné" : " vs demandé"), cls: "warn" };
  }
  function preState(it) {
    if (it.kind === "conso") return blank(it.pre) || (isNum(it.pre) && toNum(it.pre) === 0) ? { k: "done", label: "Consommé", cls: "info" } : { k: "done", label: "Reste " + fmt(it.pre), cls: "info" };
    if (!it.preOk || blank(it.pre)) return { k: "todo", label: "", cls: "" };
    const d = cmp(it.pre, it.out);
    if (d >= 0) return { k: "done", label: d > 0 ? "+" + fmt(d) : "", cls: d > 0 ? "warn" : "" };
    if (isNaN(d)) return { k: "diff", label: "À vérifier", cls: "bad" };
    return { k: "diff", label: "Manque " + fmt(-d), cls: "bad" };
  }
  const backRef = (it) => (it.preOk && !blank(it.pre) ? it.pre : it.out);
  // Valeur affichée dans le compteur : la quantité saisie, sinon la valeur proposée.
  const shown = (it, f) => (!blank(it[f]) ? it[f] : f === "out" ? expected(it) : f === "pre" ? it.out : f === "in" ? backRef(it) : f === "stk" ? 0 : f === "buy" ? cRest(it) : "");
  // Écart en direct sur une ligne pas encore cochée.
  function liveDiff(val, ref) { const d = cmp(val, ref); if (!d || isNaN(d)) return ""; return chip({ label: (d > 0 ? "+" : "−") + fmt(Math.abs(d)), cls: d < 0 ? "bad" : "warn" }); }
  // Consommable : le reste compté au pré-check vaut reste rendu tant que le retour ne dit pas autre chose.
  const consoIn = (it) => (blank(it.in) ? it.pre : it.in);
  function backState(it) {

  function parseWorkbook(wb) {

          voulu: blank(voulu) ? null : voulu, dispo: blank(dispo) ? "" : dispo, answered: !blank(dispo),
          out: blank(out) ? "" : out, in: blank(inn) || /^consomm/i.test(String(inn)) ? "" : inn,
          rem: extra ? rem.replace(EXTRA_TAG, "").replace(/^[\s–-]+/, "") : rem, extra, pre: "",

      });
    }

  async function parsePdf(buf) {

      }
    }

  }

  const shown_ = (it, f) => shown(it, f);
  function renderEvent() {

  }

      if (it[ok]) it[ok] = false;
      else { if (blank(it[f])) it[f] = shown(it, f); it[ok] = true; toast(it.name + " : " + fmt(it[f]) + " ✓"); }
      return changed();
    }
    if (d.all) { d.all.split(",").forEach((id) => { const it = byId(id); if (!it) return; ui.keep.delete(id); const f = FIELD[view.step] || "in"; if (blank(it[f])) it[f] = shown(it, f); it[f + "Ok"] = true; }); toast("Groupe coché."); return changed(); }
    if (d.step) {
      const it = byId(d.id), f = d.field; ui.keep.add(it.id);
      const ref = it.kind === "conso" && (f === "pre" || f === "in") ? (f === "in" ? consoIn(it) : null) : f === "dispo" ? it.voulu : f === "voulu" ? null : shown(it, f);
      const base = isNum(it[f]) ? toNum(it[f]) : isNum(ref) ? toNum(ref) : 0;
      it[f] = Math.max(0, base + Number(d.step));
      if (f === "dispo") it.answered = true;
      if (f === "voulu") it.inReq = requested(it.voulu) || it.extra || taken(it);
      return changed();
    }
    if (d.unextra) { const it = byId(d.unextra); it.out = ""; it.outOk = false; it.in = ""; it.extra = false; it.inReq = requested(it.voulu); if (!it.row && !it.inReq) getEv().items = getEv().items.filter((i) => i !== it); toast("Retiré."); return changed(); }
    if (d.pick) { ui.addSel = d.pick; render(); const f = $("#a-qty"); if (f) f.focus(); return; }
    switch (d.act) {
      case "home": return go({ name: "home" });
      case "new": ui.draftFile = null; return openSheet("new");
      case "pick": return pickFile("new");
      case "unpick": ui.addSel = null; return render();
      case "close": return closeSheet();
      case "add": return openSheet("add");
      case "files": return openSheet("files");
      case "import": ui.sheet = null; render(); return pickFile("event");
      case "copy": return copyText(manquesText(getEv()));
      case "photo": pendingPhoto = null; return $("#photoInput").click();
      case "phretake": pendingPhoto = null; return $("#photoInput").click();
      case "phclose": return closePhoto();
      case "phsave": return savePhotoFrames();
      case "phadd": {
        const ev = getEv(); const f = ui.photo.frames.find((x) => x.id === ui.photo.sel); if (!f) return;
        const name = t.dataset.name; const sh = ($("#phsheet") && $("#phsheet").value) || "UST";
        let it = findItem(ev, sh, name);
        if (!it) { it = { id: uid(), sheet: sh, row: null, name, kind: kindFor(sh, name), voulu: 1, dispo: "", answered: false, out: "", pre: "", in: "", rem: "Ajouté depuis une photo", extra: true, inReq: true }; ev.items.push(it); }
        else { it.inReq = true; if (!requested(it.voulu)) it.voulu = 1; }
        f.itemId = it.id; ui.photo.sel = null; ui.photo.q = ""; persist(ev, true);
        toast("Ajouté à la liste (" + sh + ") : " + name); return render();
      }
      case "phunlink": { const f = ui.photo.frames.find((x) => x.id === ui.photo.sel); if (f) f.itemId = null; return render(); }
      case "phdelframe": { ui.photo.frames = ui.photo.frames.filter((x) => x.id !== ui.photo.sel); ui.photo.sel = null; return render(); }
      case "phitem": pendingPhoto = { item: ui.viewId }; return $("#photoInput").click();
      case "ccopy": return copyText(coursesText(getEv()));
      case "cpdf": return exportCoursesPdf(getEv());
      case "cxlsx": return exportCoursesXlsx(getEv());
      case "cadd": return openSheet("cadd");
      case "xlsx": return exportXlsx(getEv(), view.step);
      case "pdf": return exportPdf(getEv(), view.step);
      case "delete": {
        if (!ui.confirmDelete) { ui.confirmDelete = true; return render(); }
        const ev = getEv(); events = events.filter((x) => x.id !== ev.id); dbDel(ev.id); toast("Événement supprimé."); return go({ name: "home" });
      }
    }
  });
  app.addEventListener("input", (e) => {
    const el = e.target;
    if (el.id === "search") { ui.query = el.value; return render(); }
    if (el.id === "phq" && ui.photo) { ui.photo.q = el.value; return render(); }
    if (el.id === "a-q") { ui.addQuery = el.value; ui.addSel = null; return render(); }
    if (el.dataset && el.dataset.field) {
      const it = byId(el.dataset.id); const v = el.value.trim(); const f = el.dataset.field; ui.keep.add(it.id);
      it[f] = v === "" ? (f === "voulu" ? null : "") : isNum(v) ? toNum(v) : v;
      if (f === "dispo") it.answered = true;
      if (f === "out" && v === "") it.outOk = false;
      persist(getEv());
    }
  });
  app.addEventListener("change", (e) => { if (e.target.dataset && e.target.dataset.field) render(); });
  $("#fileInput").addEventListener("change", (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    if (pendingImport === "event" && view.name === "event") return importIntoEvent(getEv(), f);
    const name = $("#n-name") && $("#n-name").value, date = $("#n-date") && $("#n-date").value;
    ui.draftFile = f; render();
    if ($("#n-name")) { $("#n-name").value = name || ""; $("#n-date").value = date || todayISO(); }
  });
  app.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (e.target.id === "newForm") {
      const name = $("#n-name").value.trim(); const date = $("#n-date").value || todayISO();
      if (!name) { toast("Donne un nom à l'événement."); $("#n-name").focus(); return; }
      const btn = e.target.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "Lecture du fichier…";
      try {
        const ev = await createEvent(name, date, ui.draftFile); ui.draftFile = null;
        go({ name: "event", id: ev.id, step: ev.replied ? "reponse" : "demande" });
        const n = ev.items.filter(inReq).length;
        toast(ev.fileName ? `${n} articles demandés${ev.commande ? " · N° " + ev.commande : ""}.` : "Événement créé. Importe un fichier ou ajoute les articles.");
      } catch (err) { console.error(err); btn.disabled = false; btn.textContent = "Créer l'événement"; toast(err && err.message === "vide" ? "Aucun article trouvé : est-ce bien un fichier USNE ?" : "Impossible de lire ce fichier (Excel .xlsx ou PDF attendu)."); }
      return;
    }
    if (e.target.id === "caddForm") {
      const ev = getEv(); const name = $("#c-name").value.trim(); const qv = $("#c-qty").value.trim();
      if (!name) { toast("Indique l'article."); return; }
      const qty = qv === "" ? 1 : isNum(qv) ? toNum(qv) : qv;
      ev.items.push({ id: uid(), sheet: "AUTRE", row: null, name, kind: "hors", voulu: qty, dispo: "", answered: false, out: "", pre: "", in: "", rem: $("#c-unit").value.trim(), extra: false, inReq: true, shop: $("#c-shop").value || undefined });
      persist(ev, true); toast("Ajouté aux courses : " + name);
      $("#c-name").value = ""; $("#c-qty").value = ""; $("#c-unit").value = ""; $("#c-name").focus(); render(); return;
    }
    if (e.target.id === "addForm") {
      const ev = getEv(); const retrait = view.step === "retrait";
      const qv = $("#a-qty").value.trim(); const qty = qv === "" ? 1 : isNum(qv) ? toNum(qv) : qv;
      let it = ui.addSel && byId(ui.addSel);
      const name = (it ? it.name : $("#a-q").value).trim();
      if (!name) { toast("Indique l'article."); return; }
      if (!it) { const sh = $("#a-sheet") ? $("#a-sheet").value : "UST"; it = findItem(ev, sh, name); if (!it) { it = { id: uid(), sheet: sh, row: null, name, kind: kindFor(sh, name), voulu: null, dispo: "", answered: false, out: "", pre: "", in: "", rem: "", extra: false, inReq: false }; ev.items.push(it); } }
      const rem = $("#a-rem").value.trim(); if (rem) it.rem = rem;
      if (retrait) { it.out = qty; it.outOk = true; if (!requested(it.voulu)) it.extra = true; if (!isStock(it)) it.kind = "durable"; it.inReq = true; }
      else { it.voulu = qty; it.inReq = true; }
      persist(ev, true); toast("Ajouté : " + name + " × " + fmt(qty));
      ui.addQuery = ""; ui.addSel = null; render();
      const f = $("#a-q"); if (f) f.focus();
    }
  });

  /* ================= démarrage ================= */
  function migrate(ev) {
    ev.items = (ev.items || []).filter((i) => i.source !== "surplace").map((i) => ({ ...i,
      id: i.id || uid(), sheet: i.sheet, row: i.row || null, name: i.name, kind: i.kind || kindFor(i.sheet, i.name),
      voulu: i.voulu ?? null, dispo: i.dispo ?? "", answered: i.answered ?? !blank(i.dispo), out: i.out ?? "", pre: i.pre ?? "", in: i.conso ? "" : i.in ?? "",
      outOk: i.outOk ?? !blank(i.out), preOk: i.preOk ?? !blank(i.pre), inOk: i.inOk ?? !blank(i.in),
      rem: i.rem || "", extra: i.extra ?? i.source === "ajout", inReq: i.inReq ?? (requested(i.voulu) || i.source === "ajout" || !blank(i.out)), prevVoulu: i.prevVoulu,
    }));
    ev.replySheets = ev.replySheets || []; return ev;
  }
  (async function boot() {
    try { events = (await dbAll()).map(migrate); } catch (e) { memoryOnly = true; events = []; }
    render();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  })();
  // Mises à jour : on vérifie à chaque ouverture et retour dans l'app, et on recharge dès qu'une nouvelle version prend la main.
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
      reg.update().catch(() => {});
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
